<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QA Edge-Case Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brandDark: '#0b1329',
              cardDark: '#111a3a',
              innerDark: '#090f20',
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-brandDark text-slate-100 min-h-screen font-sans antialiased selection:bg-sky-500 selection:text-white"
  >
    <div class="max-w-4xl mx-auto px-4 py-8 md:py-12">
      <!-- Header -->
      <header
        class="flex items-center justify-between pb-8 mb-8 border-b border-slate-800/80"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-12 h-12 rounded-full bg-sky-600 flex items-center justify-center font-bold text-white text-lg shadow-md shadow-sky-500/20"
          >
            SG
          </div>
          <div>
            <h2 class="font-bold text-white text-base leading-tight">
              Sergio Garcia
            </h2>
            <p class="text-xs text-sky-400 font-medium">
              Adventures of a QA Engineer
            </p>
          </div>
        </div>
        <div>
          <span
            class="px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-800/90 text-slate-300 border border-slate-700"
          >
            AI Testing Toolkit
          </span>
        </div>
      </header>

      <!-- Hero Section -->
      <section class="text-center my-10">
        <h1
          class="text-3xl md:text-4xl font-extrabold text-sky-400 mb-3 tracking-tight"
        >
          QA Edge-Case Generator
        </h1>
        <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">
          Paste an endpoint URL or schema to generate detailed test scenarios
          and locators.
        </p>
      </section>

      <!-- Form -->
      <section class="mb-12">
        <form id="generatorForm" class="flex flex-col sm:flex-row gap-3">
          <input
            type="text"
            id="urlInput"
            placeholder="https://www.example.com/"
            value=""
            class="flex-1 bg-innerDark border border-slate-700/80 rounded-xl px-4 py-3.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition text-sm md:text-base shadow-inner"
            required
          />
          <button
            type="submit"
            id="generateBtn"
            class="bg-sky-500 hover:bg-sky-400 active:bg-sky-600 text-white font-bold px-6 py-3.5 rounded-xl transition shadow-lg shadow-sky-500/25 whitespace-nowrap text-sm md:text-base cursor-pointer"
          >
            Generate Cases
          </button>
        </form>
      </section>

      <!-- Results Section -->
      <main id="resultsContainer" class="space-y-6">
        <h2 class="text-xl font-bold text-white tracking-wide mb-4">
          Generated Test Cases
        </h2>

        <div id="casesList" class="space-y-6"></div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
